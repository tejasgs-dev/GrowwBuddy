# Render Blueprint for GrowwBuddy. Facts-only. No investment advice.
# Free tier, no persistent disk: chats reset on every restart, deploy and spin-down; the
# index is pulled again from the latest index-* release at each start. See
# docs/deployment-plan.md (including the paid Starter + disk upgrade path).
services:
  - type: web
    name: growwbuddy
    runtime: docker
    plan: free
    region: singapore           # cannot be changed after the service is created
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: GROQ_API_KEY
        sync: false             # asked for when the Blueprint is first created
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROWWBUDDY_REASONING_EFFORT
        value: low
      - key: GROWWBUDDY_INDEX_REPO
        value: tejasgs-dev/GrowwBuddy
      - key: GROWWBUDDY_INDEX_POLL_MINUTES
        value: "60"
      # Read-only fine-grained token (Contents: read). Needed for a private repo; also
      # recommended for a public one: unauthenticated GitHub API calls are limited per IP,
      # and Render's outbound IPs are shared.
      - key: GROWWBUDDY_INDEX_TOKEN
        sync: false
      - key: GROWWBUDDY_FRONTEND_ORIGIN
        value: https://growwbuddy.onrender.com   # update if Render assigns another name
      - key: GROWWBUDDY_STALE_DAYS
        value: "3"
      # Model-answered messages per client per minute (default 2).
      - key: GROWWBUDDY_CLIENT_PER_MINUTE
        value: "4"
