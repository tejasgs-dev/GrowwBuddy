name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflows:
    # Task 7.10: lint the workflow files (refresh-data.yml included). actionlint also runs
    # shellcheck, which the ubuntu runner has, on every `run:` block.
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint (pinned, checksum verified)
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --max-time 60 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint

      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

  backend:
    runs-on: ubuntu-latest
    strategy:
      # Run both versions to the end: a failure on one must not hide the other's result.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        # CPU-only torch keeps the install small (pulled in by sentence-transformers).
        # setuptools: torch requires it, and the runner's Python 3.11 ships 79.0.1, which
        # satisfies torch but has known advisories (PYSEC-2026-3447, GHSA-xmj3-9gf7-h52w),
        # so pip-audit fails. Upgrade it to the fixed release first.
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "backend[dev]"

      - name: No secrets committed (EV-0-05)
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo ".env is committed"; exit 1; fi
          for p in '.env' 'data/' 'corpus/raw/' 'node_modules/' '__pycache__/'; do
            grep -qxF "$p" .gitignore || grep -qxF "${p%/}/*" .gitignore || { echo "missing in .gitignore: $p"; exit 1; }
          done

      - name: Lint
        run: make lint

      - name: Test
        # No GROQ_API_KEY here on purpose: model calls are mocked in CI.
        run: make test

      - name: Dependency audit (EV-6-13)
        run: python -m pip_audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        # Includes the shared PII pattern checks (EV-5-07); the backend job checks the
        # generated JSON matches pii_guard.py.
        run: npm test

      - name: Build
        run: npm run build

      - name: No secrets or config names in the bundle (task 6.10, EV-6-11)
        run: |
          if grep -rEl 'GROQ_API_KEY|GROQ_MODEL|GROWWBUDDY_[A-Z_]+|gsk_[A-Za-z0-9]{20,}' dist; then echo "secret-like string in bundle"; exit 1; fi

      - name: Dependency audit (EV-6-13)
        run: npm audit --omit=dev --audit-level=high
