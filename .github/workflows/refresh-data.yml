# Daily data refresh (Phase 7). Facts-only. No investment advice.
#
# Every day at about 10:00 IST: fetch the five Groww pages, parse, clean, chunk, embed and
# extract facts into a standalone index bundle, run the quality gates and the link check,
# then publish:
#   - a new release `index-YYYY-MM-DD` (bundle.sqlite + manifest.json) when a page changed,
#   - or only a heartbeat (a new manifest.json with a fresh checked_at) on the latest
#     index release when nothing changed.
# A failed gate publishes nothing and opens/updates the "Daily data refresh failed" issue;
# the app keeps yesterday's data. The app pulls new releases itself (growwbuddy/refresh.py).
#
# Run by hand: Actions -> Refresh data -> Run workflow (tick "force" to rebuild anyway).

name: Refresh data

on:
  schedule:
    # GitHub cron is UTC: 04:30 UTC = 10:00 IST. Scheduled runs can start a few minutes late
    # and only run on the default branch.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish a bundle even if no page changed
        type: boolean
        default: false

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write # create the release / upload the heartbeat
  issues: write # failure and fact-change alerts (task 7.5)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROWWBUDDY_EMBED_MODEL: intfloat/e5-small-v2
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OUT: ${{ github.workspace }}/out
      PREV: ${{ github.workspace }}/prev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Cache the embedding model
        # ~130 MB; keyed on the model so a model change downloads the new one.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ runner.os }}-${{ env.GROWWBUDDY_EMBED_MODEL }}

      - name: Install
        # CPU-only torch keeps the install small (pulled in by sentence-transformers).
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "backend[torch]"

      - name: Download the previous bundle
        id: prev
        run: |
          mkdir -p "$PREV"
          tag=$(gh release list --limit 50 --exclude-drafts --exclude-pre-releases \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("index-"))] | sort_by(.publishedAt) | last | .tagName // ""')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Previous index release: $tag"
            gh release download "$tag" --pattern manifest.json --pattern bundle.sqlite --dir "$PREV"
          else
            echo "No previous index release; building from scratch."
          fi

      - name: Build bundle (fetch, parse, chunk, embed, facts, gates, link check)
        id: build
        # No GROQ_API_KEY on purpose (task 7.9 decision): exit-load wording the rules don't
        # recognise is stored unverified and listed in the review issue, not sent to Groq.
        env:
          FORCE: ${{ inputs.force }}
        run: |
          args=(--bundle "$OUT" --previous "$PREV")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python -m growwbuddy.ingest "${args[@]}"
          {
            echo "outcome=$(jq -r .outcome "$OUT/result.json")"
            echo "fact_changes=$(jq '.fact_changes | length' "$OUT/result.json")"
            echo "needs_review=$(jq '.needs_review | length' "$OUT/result.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          if [ -f "$OUT/summary.md" ]; then cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish the new bundle
        if: steps.build.outputs.outcome == 'bundle'
        run: |
          tag="index-$(date -u +%Y-%m-%d)"
          if gh release view "$tag" > /dev/null 2>&1; then
            tag="$tag.$(date -u +%H%M%S)"  # a second (manual) build on the same day
          fi
          gh release create "$tag" "$OUT/bundle.sqlite" "$OUT/manifest.json" \
            --target "$GITHUB_SHA" --title "Index $tag" --notes-file "$OUT/summary.md" \
            --latest=false
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Heartbeat on the latest release
        if: steps.build.outputs.outcome == 'heartbeat'
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          gh release upload "$PREV_TAG" "$OUT/manifest.json" --clobber
          echo "Heartbeat uploaded to $PREV_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Open a fact-review issue
        if: >-
          steps.build.outputs.outcome == 'bundle' &&
          (steps.build.outputs.fact_changes != '0' || steps.build.outputs.needs_review != '0')
        run: |
          python -m growwbuddy.ingest.notify facts "$OUT/result.json" --run-url "$RUN_URL" \
            > "$RUNNER_TEMP/facts.md"
          gh issue create --title "Scheme facts to review ($(date -u +%Y-%m-%d))" \
            --body-file "$RUNNER_TEMP/facts.md"

      - name: Report the failure
        if: failure()
        run: |
          title="Daily data refresh failed"
          if ! python -m growwbuddy.ingest.notify failure "$OUT/result.json" \
              --run-url "$RUN_URL" > "$RUNNER_TEMP/failure.md"; then
            printf 'The daily data refresh failed: %s\n' "$RUN_URL" > "$RUNNER_TEMP/failure.md"
          fi
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // \"\"")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$RUNNER_TEMP/failure.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/failure.md"
          fi
